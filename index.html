<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>SNAKE.IO — LCD EDITION</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#0d1105;overflow:hidden;overscroll-behavior:none;
    font-family:"Courier New",monospace;color:#7e9440;user-select:none;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #phone{background:#1b2410;padding:12px;border-radius:10px;
    box-shadow:inset 0 0 0 2px #33421c, inset 0 0 0 4px #161d0b, 0 14px 40px rgba(0,0,0,.75);}
  #screenWrap{position:relative;line-height:0;overflow:hidden;background:#a5c93a;}
  #screenWrap::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.075) 0 1px, rgba(0,0,0,0) 1px 3px);}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
  #hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;opacity:.35;}
</style>
</head>
<body>
<div id="app">
  <div id="phone">
    <div id="screenWrap"><canvas id="screen"></canvas></div>
  </div>
</div>
<div id="hint">SNAKE.IO</div>
<script>
(function(){
'use strict';

/* ============================================================
   PALETA LCD (4 tons monocromáticos estilo Nokia/Game Boy)
   ============================================================ */
const PAL = {
  BG:    '#a5c93a',
  BG2:   '#96b830',
  MID:   '#5f7a14',
  DARK:  '#1f2b06',
  LIGHT: '#dff0a0',
  OUT1:  '#3a4a0f',
  OUT2:  '#2c3a0b'
};

/* ============================================================
   FONTE BITMAP 5x7
   ============================================================ */
const FONT_RAW = {
 A:'01110,10001,10001,11111,10001,10001,10001',
 B:'11110,10001,10001,11110,10001,10001,11110',
 C:'01110,10001,10000,10000,10000,10001,01110',
 D:'11110,10001,10001,10001,10001,10001,11110',
 E:'11111,10000,10000,11110,10000,10000,11111',
 F:'11111,10000,10000,11110,10000,10000,10000',
 G:'01110,10001,10000,10111,10001,10001,01111',
 H:'10001,10001,10001,11111,10001,10001,10001',
 I:'11111,00100,00100,00100,00100,00100,11111',
 J:'00111,00010,00010,00010,00010,10010,01100',
 K:'10001,10010,10100,11000,10100,10010,10001',
 L:'10000,10000,10000,10000,10000,10000,11111',
 M:'10001,11011,10101,10101,10001,10001,10001',
 N:'10001,11001,10101,10011,10001,10001,10001',
 O:'01110,10001,10001,10001,10001,10001,01110',
 P:'11110,10001,10001,11110,10000,10000,10000',
 Q:'01110,10001,10001,10001,10101,10010,01101',
 R:'11110,10001,10001,11110,10100,10010,10001',
 S:'01111,10000,10000,01110,00001,00001,11110',
 T:'11111,00100,00100,00100,00100,00100,00100',
 U:'10001,10001,10001,10001,10001,10001,01110',
 V:'10001,10001,10001,10001,10001,01010,00100',
 W:'10001,10001,10001,10101,10101,11011,10001',
 X:'10001,10001,01010,00100,01010,10001,10001',
 Y:'10001,10001,01010,00100,00100,00100,00100',
 Z:'11111,00001,00010,00100,01000,10000,11111',
 '0':'01110,10001,10011,10101,11001,10001,01110',
 '1':'00100,01100,00100,00100,00100,00100,01110',
 '2':'01110,10001,00001,00110,01000,10000,11111',
 '3':'11111,00010,00100,00010,00001,10001,01110',
 '4':'00010,00110,01010,10010,11111,00010,00010',
 '5':'11111,10000,11110,00001,00001,10001,01110',
 '6':'00110,01000,10000,11110,10001,10001,01110',
 '7':'11111,00001,00010,00100,01000,01000,01000',
 '8':'01110,10001,10001,01110,10001,10001,01110',
 '9':'01110,10001,10001,01111,00001,00010,01100',
 ':':'00000,00100,00100,00000,00100,00100,00000',
 '.':'00000,00000,00000,00000,00000,01100,01100',
 ',':'00000,00000,00000,00000,01100,00100,01000',
 '!':'00100,00100,00100,00100,00100,00000,00100',
 '?':'01110,10001,00001,00110,00100,00000,00100',
 '-':'00000,00000,00000,11111,00000,00000,00000',
 '+':'00000,00100,00100,11111,00100,00100,00000',
 '/':'00001,00010,00010,00100,01000,01000,10000',
 '%':'11001,11011,00010,00100,01000,11011,10011',
 '(':'00010,00100,01000,01000,01000,00100,00010',
 ')':'01000,00100,00010,00010,00010,00100,01000',
 '=':'00000,00000,11111,00000,11111,00000,00000',
 '<':'00010,00100,01000,10000,01000,00100,00010',
 '>':'01000,00100,00010,00001,00010,00100,01000',
 '*':'00000,10101,01110,11111,01110,10101,00000'
};

const FONT_ROWS = {};
for(const k in FONT_RAW){ FONT_ROWS[k] = FONT_RAW[k].split(','); }

/* ============================================================
   CANVAS / RESIZE
   ============================================================ */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', {alpha:false});
const BEZEL = 24;
let W = 240, H = 180, SCALE = 3;

function resize(){
  const aw = Math.max(200, window.innerWidth - BEZEL);
  const ah = Math.max(160, window.innerHeight - BEZEL);
  let s = Math.round(Math.min(aw / 300, ah / 230));
  s = Math.max(2, Math.min(6, s || 2));
  SCALE = s;
  W = Math.max(120, Math.floor(aw / s));
  H = Math.max(100, Math.floor(ah / s));
  cv.width = W; cv.height = H;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

/* ============================================================
   SPRITES (círculos pixelados)
   ============================================================ */
const spriteCache = new Map();
function discSprite(color, r){
  const key = color + '|' + r;
  let c = spriteCache.get(key);
  if(c) return c;
  const size = r * 2 + 1;
  c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = color;
  for(let dy = -r; dy <= r; dy++){
    const hh = r * r - dy * dy;
    if(hh < 0) continue;
    const half = Math.floor(Math.sqrt(hh) + 0.0001);
    g.fillRect(r - half, r + dy, half * 2 + 1, 1);
  }
  spriteCache.set(key, c);
  return c;
}

/* dithering de fundo (fora da arena) */
let outPattern = null;
(function buildPattern(){
  const p = document.createElement('canvas');
  p.width = 2; p.height = 2;
  const g = p.getContext('2d');
  g.fillStyle = PAL.OUT2; g.fillRect(0,0,2,2);
  g.fillStyle = PAL.OUT1; g.fillRect(0,0,1,1); g.fillRect(1,1,1,1);
  outPattern = ctx.createPattern(p, 'repeat');
})();

/* ============================================================
   TEXTO
   ============================================================ */
function drawText(str, x, y, color, s){
  s = s || 1;
  str = String(str).toUpperCase();
  ctx.fillStyle = color;
  let cx = Math.round(x);
  for(let i = 0; i < str.length; i++){
    const ch = str[i];
    if(ch === ' '){ cx += 5 * s; continue; }
    const rows = FONT_ROWS[ch];
    if(!rows){ cx += 6 * s; continue; }
    for(let r = 0; r < 7; r++){
      const row = rows[r];
      let run = 0;
      for(let c = 0; c <= 5; c++){
        if(c < 5 && row[c] === '1'){ run++; continue; }
        if(run){ ctx.fillRect(cx + (c - run) * s, y + r * s, run * s, s); run = 0; }
      }
    }
    cx += 6 * s;
  }
}
function textWidth(str, s){
  s = s || 1;
  str = String(str).toUpperCase();
  let w = 0;
  for(let i = 0; i < str.length; i++) w += (str[i] === ' ' ? 5 : 6) * s;
  return w;
}
function drawTextC(str, cx, y, color, s){
  drawText(str, Math.round(cx - textWidth(str, s) / 2), y, color, s);
}
function pad4(n){
  n = Math.max(0, Math.round(n));
  let s = String(n);
  while(s.length < 4) s = '0' + s;
  return s;
}

/* ============================================================
   ÁUDIO (bips de LCD)
   ============================================================ */
let AC = null, muted = false, lastBeep = 0;
function initAudio(){
  if(!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur, vol, type){
  if(!AC || muted) return;
  const now = AC.currentTime;
  if(now - lastBeep < 0.02) return;
  lastBeep = now;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(vol || 0.025, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(now); o.stop(now + dur + 0.02);
}
function sfxEat(){ beep(680 + Math.random() * 140, 0.04, 0.02); }
function sfxBig(){ beep(320, 0.07, 0.03); setTimeout(function(){ beep(520, 0.07, 0.025); }, 60); }
function sfxKill(){ beep(180, 0.10, 0.04, 'square'); setTimeout(function(){ beep(120, 0.16, 0.035, 'sawtooth'); }, 90); }
function sfxDeath(){
  beep(400, 0.12, 0.04);
  setTimeout(function(){ beep(300, 0.14, 0.04); }, 110);
  setTimeout(function(){ beep(200, 0.28, 0.04); }, 230);
}
function sfxStart(){ beep(520, 0.06, 0.03); setTimeout(function(){ beep(780, 0.09, 0.03); }, 70); }

/* ============================================================
   CONFIG
   ============================================================ */
const CFG = {
  R: 470,             // raio da arena
  SEG: 2.0,           // espaçamento entre nós do corpo
  SPEED: 46,
  BOOST_MULT: 1.9,
  TURN: 3.7,
  TURN_BOOST: 2.5,
  FOOD_MAX: 300,
  START_MASS: 12,
  NPM: 1.5,
  MAX_NODES: 420,
  AI: 11,
  R_HEAD: 3,
  R_BODY: 3,
  BOOST_COST: 15
};

const AI_NAMES = ['VIPER','KOBRA','MAMBA','PITON','TAIPAN','NAJA','SUCURI','JARARA','CASCAVEL','BOA','ANACONDA','CASCABEL','CORAL','DRAGAO','FURIA','ZUMBI'];
const AI_SHADES = ['#42561a','#4d5a12','#3b5220','#556019','#48602a'];
const PLAYER_COLOR = '#1f2b06';

/* ============================================================
   ESTADO
   ============================================================ */
let snakes = [], food = [], parts = [], floats = [], respawnQ = [];
let player = null;
let mode = 'menu';        // menu | play | dead
let deadT = 0, flash = 0, killMsg = 0, killMsgText = '';
let best = 0, tclock = 0, lastFrame = 0;
const cam = {x:0, y:0};
let nextAiName = 0;

/* ============================================================
   SNAKE
   ============================================================ */
function nodesFor(mass){
  return Math.max(10, Math.min(CFG.MAX_NODES, Math.round(mass * CFG.NPM)));
}

function makeSnake(o){
  const s = {
    isPlayer: !!o.isPlayer,
    name: o.name || 'COBRA',
    color: o.color,
    x: o.x, y: o.y,
    angle: o.angle,
    targetAngle: o.angle,
    mass: o.mass,
    path: [],
    boosting: false,
    dead: false,
    think: 0,
    tx: o.x, ty: o.y,
    chasing: false,
    bbox: {x0:0, y0:0, x1:0, y1:0},
    dropT: 0
  };
  const n = nodesFor(o.mass);
  for(let i = 0; i < n; i++){
    s.path.push({ x: o.x - Math.cos(o.angle) * i * CFG.SEG,
                  y: o.y - Math.sin(o.angle) * i * CFG.SEG });
  }
  return s;
}

function randPoint(maxD){
  const a = Math.random() * Math.PI * 2;
  const d = Math.sqrt(Math.random()) * maxD;
  return { x: Math.cos(a) * d, y: Math.sin(a) * d };
}

function spawnAI(initial){
  const p = randPoint(CFG.R * 0.82);
  const angle = Math.random() * Math.PI * 2;
  const mass = initial ? 10 + Math.random() * 45 : 12 + Math.random() * 14;
  const name = AI_NAMES[(nextAiName++) % AI_NAMES.length];
  const s = makeSnake({
    name: name,
    color: AI_SHADES[Math.floor(Math.random() * AI_SHADES.length)],
    x: p.x, y: p.y,
    angle: angle,
    mass: mass,
    isPlayer: false
  });
  snakes.push(s);
  return s;
}

function spawnPlayer(){
  const p = randPoint(CFG.R * 0.6);
  player = makeSnake({
    name: 'VOCE',
    color: PLAYER_COLOR,
    x: p.x, y: p.y,
    angle: Math.random() * Math.PI * 2,
    mass: CFG.START_MASS,
    isPlayer: true
  });
  snakes.push(player);
  pointer.active = false;
}

function spawnFood(n){
  for(let i = 0; i < n; i++){
    const p = randPoint(CFG.R * 0.96);
    food.push({ x: p.x, y: p.y, m: 0.7, big: false });
  }
}

function resetWorld(withPlayer){
  snakes = []; food = []; parts = []; floats = []; respawnQ = [];
  nextAiName = (Math.random() * 7) | 0;
  for(let i = 0; i < CFG.AI; i++) spawnAI(true);
  spawnFood(CFG.FOOD_MAX);
  if(withPlayer) spawnPlayer(); else player = null;
}

/* ============================================================
   INPUT
   ============================================================ */
const pointer = { x: 0, y: 0, down: false, active: false };
const keys = {};
let touchMode = false, turboHeld = false;
let steerId = null, boostId = null;

function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE };
}
function turboBtn(){
  const size = 34;
  return { x: W - size - 5, y: H - size - 5, s: size };
}
function inTurbo(x, y){
  const b = turboBtn();
  return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6;
}

cv.addEventListener('pointerdown', function(e){
  initAudio();
  if(e.pointerType === 'touch') touchMode = true;
  const p = canvasPos(e);
  if(touchMode && inTurbo(p.x, p.y)){
    turboHeld = true; boostId = e.pointerId;
  } else {
    steerId = e.pointerId;
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
    if(e.pointerType !== 'touch') pointer.down = true;
  }
  pressStart();
  e.preventDefault();
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  if(steerId !== null && e.pointerId !== steerId) return;
  const p = canvasPos(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
});

function releasePointer(e){
  if(e.pointerId === boostId){ turboHeld = false; boostId = null; }
  if(e.pointerId === steerId) steerId = null;
  if(e.pointerType !== 'touch') pointer.down = false;
}
cv.addEventListener('pointerup', releasePointer);
cv.addEventListener('pointercancel', releasePointer);
window.addEventListener('blur', function(){ pointer.down = false; turboHeld = false; });

window.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  keys[k] = true;
  initAudio();
  if(k === ' ' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
  if(k === 'm') muted = !muted;
  pressStart();
});

window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

function pressStart(){
  if(mode === 'menu'){ startGame(); }
  else if(mode === 'dead' && deadT > 0.55){ startGame(); }
}

/* ============================================================
   INÍCIO DE JOGO
   ============================================================ */
function startGame(){
  resetWorld(true);
  mode = 'play';
  deadT = 0;
  flash = 0;
  cam.x = player.x; cam.y = player.y;
  sfxStart();
}

/* ============================================================
   MOVIMENTO
   ============================================================ */
function angleDiff(a, b){
  let d = a - b;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  return d;
}

function moveSnake(s, dt){
  // turbo
  if(s.boosting){
    if(s.mass <= 14){ s.boosting = false; }
    else {
      s.mass -= CFG.BOOST_COST * dt;
      s.dropT += dt;
      if(s.dropT > 0.14){
        s.dropT = 0;
        const n = s.path[Math.min(s.path.length - 1, 5)];
        if(n) food.push({ x: n.x + (Math.random() - 0.5) * 3, y: n.y + (Math.random() - 0.5) * 3, m: 0.55, big: false });
      }
    }
  }
  const turn = (s.boosting ? CFG.TURN_BOOST : CFG.TURN) * dt;
  const d = angleDiff(s.targetAngle, s.angle);
  s.angle += Math.max(-turn, Math.min(turn, d));

  const spd = CFG.SPEED * (s.boosting ? CFG.BOOST_MULT : 1);
  s.x += Math.cos(s.angle) * spd * dt;
  s.y += Math.sin(s.angle) * spd * dt;

  const h = s.path[0];
  if(!h || Math.hypot(s.x - h.x, s.y - h.y) >= CFG.SEG){
    s.path.unshift({ x: s.x, y: s.y });
  }
  const maxN = nodesFor(s.mass);
  while(s.path.length > maxN) s.path.pop();

  // bbox
  let x0 = s.x, y0 = s.y, x1 = s.x, y1 = s.y;
  const st = s.path.length > 60 ? 2 : 1;
  for(let i = 0; i < s.path.length; i += st){
    const n = s.path[i];
    if(n.x < x0) x0 = n.x; if(n.x > x1) x1 = n.x;
    if(n.y < y0) y0 = n.y; if(n.y > y1) y1 = n.y;
  }
  s.bbox.x0 = x0; s.bbox.y0 = y0; s.bbox.x1 = x1; s.bbox.y1 = y1;
}

function steerPlayer(dt){
  const p = player;
  let steer = false;
  if(keys['arrowleft'] || keys['a']){ p.targetAngle = p.angle - 1.0; steer = true; }
  else if(keys['arrowright'] || keys['d']){ p.targetAngle = p.angle + 1.0; steer = true; }

  if(!steer && pointer.active){
    const tx = pointer.x + cam.x - W / 2;
    const ty = pointer.y + cam.y - H / 2;
    const dx = tx - p.x, dy = ty - p.y;
    if(dx * dx + dy * dy > 9) p.targetAngle = Math.atan2(dy, dx);
  }
  const wantBoost = pointer.down || turboHeld || keys[' '];
  p.boosting = wantBoost && p.mass > 14;
}

/* ============================================================
   IA
   ============================================================ */
const LOOK = 24;

function obstaclePenalty(px, py, self){
  let minD2 = 1e9;
  for(let k = 0; k < snakes.length; k++){
    const o = snakes[k];
    if(o === self || o.dead) continue;
    const b = o.bbox;
    if(px < b.x0 - 16 || px > b.x1 + 16 || py < b.y0 - 16 || py > b.y1 + 16) continue;
    const hx = o.x - px, hy = o.y - py;
    const hd = hx * hx + hy * hy;
    if(hd < minD2) minD2 = hd;
    const step = o.path.length > 50 ? 2 : 1;
    for(let i = 0; i < o.path.length; i += step){
      const n = o.path[i];
      const dx = n.x - px, dy = n.y - py;
      const d2 = dx * dx + dy * dy;
      if(d2 < minD2) minD2 = d2;
    }
  }
  const d = Math.sqrt(minD2);
  if(d > 18) return 0;
  return (18 - d) / 18;
}

function wander(s){
  const a = Math.random() * Math.PI * 2;
  const dist = 90 + Math.random() * 220;
  let tx = s.x + Math.cos(a) * dist;
  let ty = s.y + Math.sin(a) * dist;
  const dd = Math.hypot(tx, ty);
  const lim = CFG.R * 0.88;
  if(dd > lim){ tx *= lim / dd; ty *= lim / dd; }
  s.tx = tx; s.ty = ty;
}

function pickAiTarget(s){
  s.chasing = false;
  const r = Math.random();
  if(r < 0.52){
    let bestD = 320 * 320, bi = -1;
    for(let i = 0; i < food.length; i++){
      const f = food[i];
      const dx = f.x - s.x, dy = f.y - s.y;
      const d2 = dx * dx + dy * dy;
      if(d2 < bestD){ bestD = d2; bi = i; }
    }
    if(bi >= 0){ s.tx = food[bi].x; s.ty = food[bi].y; }
    else wander(s);
  } else if(r < 0.80 && player && !player.dead){
    s.tx = player.x + Math.cos(player.angle) * 14;
    s.ty = player.y + Math.sin(player.angle) * 14;
    s.chasing = true;
  } else {
    wander(s);
  }
}

function aiThink(s, dt){
  s.think -= dt;
  if(s.think <= 0){
    s.think = 0.5 + Math.random() * 1.1;
    pickAiTarget(s);
  }
  const desired = Math.atan2(s.ty - s.y, s.tx - s.x);
  const offs = [0, 0.25, -0.25, 0.55, -0.55, 0.95, -0.95, 1.5, -1.5];
  let bestScore = -1e9, bestA = s.angle;

  for(let i = 0; i < offs.length; i++){
    const a = s.angle + offs[i];
    const px = s.x + Math.cos(a) * LOOK;
    const py = s.y + Math.sin(a) * LOOK;
    let score = -Math.abs(angleDiff(desired, a)) * 1.1;
    const bd = Math.hypot(px, py);
    if(bd > CFG.R - 30) score -= 8 + (bd - (CFG.R - 30)) * 0.8;
    score -= obstaclePenalty(px, py, s) * 9;
    if(i > 0) score -= 0.02;
    if(score > bestScore){ bestScore = score; bestA = a; }
  }
  s.targetAngle = bestA;

  // turbo ocasional ao caçar
  if(s.chasing && s.mass > 30){
    const dd = Math.hypot(s.tx - s.x, s.ty - s.y);
    s.boosting = dd > 60 && dd < 170 && Math.random() < 0.06;
  } else {
    s.boosting = false;
  }
}

/* ============================================================
   COLISÕES / COMER / MORTE
   ============================================================ */
function killSnake(s, killer){
  if(s.dead) return;
  s.dead = true;
  const total = s.mass * 0.8;
  const cnt = Math.max(4, Math.min(110, Math.floor(s.path.length / 2)));
  const per = Math.max(0.5, Math.min(6, total / cnt));
  const step = Math.max(1, Math.floor(s.path.length / cnt));
  for(let i = 0; i < s.path.length; i += step){
    const n = s.path[i];
    food.push({ x: n.x + (Math.random() - 0.5) * 2, y: n.y + (Math.random() - 0.5) * 2,
                m: per, big: per > 1.6 });
  }
  for(let i = 0; i < 8; i++){
    parts.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, t: 0.5 });
  }
  if(killer && killer.isPlayer){
    killMsg = 1.6;
    killMsgText = 'ELIMINADO ' + s.name;
    floats.push({ x: s.x, y: s.y, text: '+' + Math.round(s.mass), t: 1.2 });
    sfxKill();
  }
  if(s.isPlayer){
    mode = 'dead';
    deadT = 0;
    flash = 0.35;
    best = Math.max(best, Math.round(s.mass));
    sfxDeath();
  } else {
    respawnQ.push(1.6 + Math.random() * 2.2);
  }
  if(food.length > 1100) food.splice(0, food.length - 1100);
}

function handleCollisions(){
  for(let a = 0; a < snakes.length; a++){
    const s = snakes[a];
    if(s.dead) continue;
    const hr = CFG.R_HEAD;
    // borda
    if(s.x * s.x + s.y * s.y > (CFG.R - 1) * (CFG.R - 1)){ killSnake(s, null); continue; }

    for(let b = 0; b < snakes.length; b++){
      const o = snakes[b];
      if(o === s || o.dead) continue;
      const bb = o.bbox;
      if(s.x < bb.x0 - 8 || s.x > bb.x1 + 8 || s.y < bb.y0 - 8 || s.y > bb.y1 + 8) continue;

      const th = hr + CFG.R_BODY - 1;
      const th2 = th * th;
      const hdx = o.x - s.x, hdy = o.y - s.y;
      if(hdx * hdx + hdy * hdy < th2){ killSnake(s, o); break; }
      let hit = false;
      const st = o.path.length > 60 ? 2 : 1;
      for(let i = 0; i < o.path.length; i += st){
        const n = o.path[i];
        const dx = n.x - s.x, dy = n.y - s.y;
        if(dx * dx + dy * dy < th2){ hit = true; break; }
      }
      if(hit){ killSnake(s, o); break; }
    }
  }
}

function updateFood(dt){
  const pulse = Math.floor(tclock * 3) % 2;

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    const rr = CFG.R_HEAD + 3.2;
    const rr2 = rr * rr;
    for(let j = food.length - 1; j >= 0; j--){
      const f = food[j];
      const dx = f.x - s.x, dy = f.y - s.y;
      if(dx * dx + dy * dy < rr2){
        s.mass += f.m;
        food.splice(j, 1);
        if(s.isPlayer){
          beep(f.big ? 420 : (620 + Math.random() * 180), 0.035, 0.018);
          if(f.big) sfxBig();
          for(let k = 0; k < (f.big ? 5 : 2); k++){
            parts.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, t: 0.35 });
          }
        }
      }
    }
  }
  // mantém comida no mapa
  if(food.length < CFG.FOOD_MAX){
    spawnFood(Math.min(5, CFG.FOOD_MAX - food.length));
  }
  // partículas
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.t -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if(p.t <= 0) parts.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    floats[i].t -= dt;
    floats[i].y -= dt * 12;
    if(floats[i].t <= 0) floats.splice(i, 1);
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(dt){
  tclock += dt;
  if(flash > 0) flash -= dt;
  if(killMsg > 0) killMsg -= dt;

  for(let i = respawnQ.length - 1; i >= 0; i--){
    respawnQ[i] -= dt;
    if(respawnQ[i] <= 0){ respawnQ.splice(i, 1); spawnAI(false); }
  }

  if(mode === 'menu'){
    cam.x = Math.cos(tclock * 0.07) * CFG.R * 0.5;
    cam.y = Math.sin(tclock * 0.11) * CFG.R * 0.5;
  }

  if(mode === 'play' && player && !player.dead) steerPlayer(dt);

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    if(!s.isPlayer) aiThink(s, dt);
    moveSnake(s, dt);
  }

  if(mode === 'play' && player && !player.dead){
    cam.x += (player.x - cam.x) * Math.min(1, dt * 11);
    cam.y += (player.y - cam.y) * Math.min(1, dt * 11);
  }
  if(mode === 'dead') deadT += dt;

  handleCollisions();
  updateFood(dt);
}

/* remove cobras mortas da lista após um tempo */
setInterval(function(){
  for(let i = snakes.length - 1; i >= 0; i--){
    if(snakes[i].dead && snakes[i] !== player) snakes.splice(i, 1);
  }
}, 1200);

function loop(now){
  if(!lastFrame) lastFrame = now;
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if(!isFinite(dt) || dt < 0) dt = 0.016;
  dt = Math.min(0.033, dt);
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   RENDER
   ============================================================ */
function sx(x){ return x - cam.x + W / 2; }
function sy(y){ return y - cam.y + H / 2; }

function fillCircle(cx, cy, r, color){
  const y0 = Math.max(0, Math.ceil(cy - r));
  const y1 = Math.min(H - 1, Math.floor(cy + r));
  ctx.fillStyle = color;
  for(let y = y0; y <= y1; y++){
    const dy = y - cy;
    const hh = r * r - dy * dy;
    if(hh < 0) continue;
    const h = Math.sqrt(hh);
    const a = Math.max(0, Math.round(cx - h));
    const b = Math.min(W - 1, Math.round(cx + h));
    if(b >= a) ctx.fillRect(a, y, b - a + 1, 1);
  }
}

function circleRing(cx, cy, rOut, rIn, color){
  const y0 = Math.max(0, Math.ceil(cy - rOut));
  const y1 = Math.min(H - 1, Math.floor(cy + rOut));
  ctx.fillStyle = color;
  for(let y = y0; y <= y1; y++){
    const dy = y - cy;
    const ho2 = rOut * rOut - dy * dy;
    if(ho2 < 0) continue;
    const ho = Math.sqrt(ho2);
    const hi2 = rIn * rIn - dy * dy;
    const xo0 = Math.max(0, Math.round(cx - ho));
    const xo1 = Math.min(W - 1, Math.round(cx + ho));
    if(hi2 <= 0){
      if(xo1 >= xo0) ctx.fillRect(xo0, y, xo1 - xo0 + 1, 1);
    } else {
      const hi = Math.sqrt(hi2);
      const xi0 = Math.round(cx - hi), xi1 = Math.round(cx + hi);
      const a1 = Math.max(0, Math.min(W - 1, xi0));
      if(a1 > xo0) ctx.fillRect(xo0, y, a1 - xo0, 1);
      const b1 = Math.min(W - 1, Math.max(0, xi1));
      if(xo1 > b1) ctx.fillRect(b1 + 1, y, xo1 - b1, 1);
    }
  }
}

function drawArena(){
  ctx.fillStyle = outPattern;
  ctx.fillRect(0, 0, W, H);
  const ax = sx(0), ay = sy(0);
  circleRing(ax, ay, CFG.R, CFG.R - 4, PAL.DARK);
  fillCircle(ax, ay, CFG.R - 4, PAL.BG);

  // grade de pixels (só dentro da arena)
  ctx.fillStyle = 'rgba(31,43,6,0.085)';
  const step = 8;
  const wStartX = cam.x - W / 2, wStartY = cam.y - H / 2;
  const gx0 = Math.floor(wStartX / step) * step;
  const gy0 = Math.floor(wStartY / step) * step;
  for(let gx = gx0; gx < wStartX + W; gx += step){
    for(let gy = gy0; gy < wStartY + H; gy += step){
      if(gx * gx + gy * gy > (CFG.R - 6) * (CFG.R - 6)) continue;
      ctx.fillRect(Math.round(sx(gx)), Math.round(sy(gy)), 1, 1);
    }
  }
}

function drawFood(){
  const pulse = Math.floor(tclock * 3) % 2;
  for(let i = 0; i < food.length; i++){
    const f = food[i];
    const px = Math.round(sx(f.x)), py = Math.round(sy(f.y));
    if(px < -4 || px > W + 4 || py < -4 || py > H + 4) continue;
    if(f.big){
      const r = pulse ? 2 : 1;
      ctx.fillStyle = PAL.DARK;
      ctx.fillRect(px - r, py - r, r * 2 + 1, r * 2 + 1);
      ctx.fillStyle = PAL.LIGHT;
      ctx.fillRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = PAL.MID;
      ctx.fillRect(px - 1, py - 1, 3, 3);
    }
  }
}

function drawSnake(s){
  const n = s.path.length;
  for(let i = n - 1; i >= 0; i--){
    const nd = s.path[i];
    const px = Math.round(sx(nd.x)), py = Math.round(sy(nd.y));
    if(px < -8 || px > W + 8 || py < -8 || py > H + 8) continue;
    let r = CFG.R_BODY;
    if(i > n - 5) r = 2;
    ctx.drawImage(discSprite(s.color, r), px - r, py - r);
  }
  const hx = Math.round(sx(s.x)), hy = Math.round(sy(s.y));
  const hr = s.boosting ? 4 : CFG.R_HEAD;
  ctx.drawImage(discSprite(s.color, hr), hx - hr, hy - hr);

  // olhos
  const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
  const ex = -sa, ey = ca;
  ctx.fillStyle = PAL.LIGHT;
  const ox = ca * 1.2, oy = sa * 1.2;
  ctx.fillRect(Math.round(hx + ox + ex * 2), Math.round(hy + oy + ey * 2), 1, 1);
  ctx.fillRect(Math.round(hx + ox - ex * 2), Math.round(hy + oy - ey * 2), 1, 1);

  // nome
  if(s.name && !s.isPlayer && hx > -30 && hx < W + 30 && hy > -20 && hy < H + 20){
    drawTextC(s.name, hx, hy - 12, PAL.DARK, 1);
  }
  if(s.isPlayer && mode === 'play'){
    drawTextC('VOCE', hx, hy - 12, PAL.DARK, 1);
  }
}

function drawParticles(){
  for(let i = 0; i < parts.length; i++){
    const p = parts[i];
    const px = Math.round(sx(p.x)), py = Math.round(sy(p.y));
    if(px < 0 || px >= W || py < 0 || py >= H) continue;
    ctx.fillStyle = p.t > 0.2 ? PAL.LIGHT : PAL.MID;
    ctx.fillRect(px, py, 1, 1);
  }
  for(let i = 0; i < floats.length; i++){
    const f = floats[i];
    drawTextC(f.text, sx(f.x), sy(f.y), PAL.DARK, 1);
  }
}

function drawHUD(){
  if(!player) return;
  const alive = [];
  for(let i = 0; i < snakes.length; i++) if(!snakes[i].dead) alive.push(snakes[i]);
  alive.sort(function(a, b){ return b.mass - a.mass; });
  let rank = 0;
  for(let i = 0; i < alive.length; i++) if(alive[i].isPlayer) rank = i + 1;

  drawText('TAM ' + pad4(player.mass), 3, 3, PAL.DARK, 1);
  drawText('RANK ' + rank + '/' + alive.length, 3, 12, PAL.DARK, 1);

  const showNames = W >= 190;
  const limit = showNames ? 5 : 3;
  let y = 3;
  for(let i = 0; i < alive.length && i < limit; i++){
    const s = alive[i];
    const label = (i + 1) + ' ' + (s.isPlayer ? 'VOCE' : (showNames ? s.name : '')) + ' ' + Math.round(s.mass);
    const w = textWidth(label, 1);
    drawText(label, W - 4 - w, y, s.isPlayer ? PAL.DARK : PAL.MID, 1);
    y += 9;
  }

  if(killMsg > 0){
    drawTextC(killMsgText, W / 2, 40, PAL.DARK, 1);
  }

  drawMinimap();

  if(touchMode){
    const b = turboBtn();
    ctx.fillStyle = 'rgba(165,201,58,0.55)';
    ctx.fillRect(b.x, b.y, b.s, b.s);
    ctx.fillStyle = PAL.DARK;
    ctx.fillRect(b.x, b.y, b.s, 1); ctx.fillRect(b.x, b.y + b.s - 1, b.s, 1);
    ctx.fillRect(b.x, b.y, 1, b.s); ctx.fillRect(b.x + b.s - 1, b.y, 1, b.s);
    drawTextC(turboHeld ? '>>' : 'TURBO', b.x + b.s / 2, b.y + b.s / 2 - 3, PAL.DARK, 1);
  }
}

function drawMinimap(){
  const size = Math.min(46, Math.max(30, Math.round(H * 0.26)));
  const mx = 3, my = H - size - 3;
  ctx.fillStyle = 'rgba(223,240,160,0.5)';
  ctx.fillRect(mx, my, size, size);
  ctx.fillStyle = PAL.DARK;
  ctx.fillRect(mx, my, size, 1); ctx.fillRect(mx, my + size - 1, size, 1);
  ctx.fillRect(mx, my, 1, size); ctx.fillRect(mx + size - 1, my, 1, size);

  const cx = mx + size / 2, cy = my + size / 2, rad = size / 2 - 3;
  ctx.fillStyle = PAL.MID;
  for(let a = 0; a < Math.PI * 2; a += Math.PI / 18){
    ctx.fillRect(Math.round(cx + Math.cos(a) * rad), Math.round(cy + Math.sin(a) * rad), 1, 1);
  }
  const k = rad / CFG.R;
  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    const px = Math.round(cx + s.x * k), py = Math.round(cy + s.y * k);
    if(s.isPlayer){
      ctx.fillStyle = PAL.DARK;
      ctx.fillRect(px - 1, py - 1, 3, 3);
      ctx.fillStyle = PAL.LIGHT;
      ctx.fillRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = PAL.MID;
      ctx.fillRect(px, py, 1, 1);
    }
  }
}

function panel(x, y, w, h, fill){
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = PAL.DARK;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

function drawMenu(){
  const pw = Math.max(112, Math.min(W - 12, 200));
  const lines = ['MOUSE = GUIAR', 'TOQUE = GUIAR', 'CLIQUE = TURBO', 'ESPACO = TURBO',
                 'COMER = CRESCER', 'MELHOR ' + pad4(best)];
  const ph = 46 + lines.length * 10 + 22;
  const px = Math.round((W - pw) / 2), py = Math.round((H - ph) / 2);
  panel(px, py, pw, ph, 'rgba(165,201,58,0.93)');

  const ts = Math.max(1, Math.min(3, Math.floor((pw - 14) / textWidth('SNAKE.IO', 1))));
  drawTextC('SNAKE.IO', W / 2, py + 8, PAL.DARK, ts);

  // cobrinha decorativa
  const dy = py + 10 + 7 * ts + 4;
  ctx.fillStyle = PAL.MID;
  for(let i = 0; i < 14; i++) ctx.fillRect(px + 12 + i * 3, dy, 2, 2);
  ctx.fillStyle = PAL.DARK;
  ctx.fillRect(px + 12 + 13 * 3 + 1, dy - 1, 2, 2);

  let y = dy + 7;
  for(let i = 0; i < lines.length; i++){
    drawTextC(lines[i], W / 2, y, i === lines.length - 1 ? PAL.MID : PAL.DARK, 1);
    y += 10;
  }
  if((tclock % 1) < 0.62) drawTextC('JOGAR', W / 2, py + ph - 11, PAL.DARK, 1);
}

function drawDead(){
  if(!player) return;
  const alive = snakes.filter(function(s){ return !s.dead; });
  alive.sort(function(a, b){ return b.mass - a.mass; });

  const pw = Math.max(120, Math.min(W - 12, 190));
  const ph = 92;
  const px = Math.round((W - pw) / 2), py = Math.round((H - ph) / 2);
  panel(px, py, pw, ph, 'rgba(165,201,58,0.94)');

  const ts = Math.max(1, Math.min(2, Math.floor((pw - 14) / textWidth('MORREU', 1))));
  drawTextC('VOCE', W / 2, py + 8, PAL.DARK, ts);
  drawTextC('MORREU', W / 2, py + 10 + 7 * ts, PAL.DARK, ts);

  let y = py + 14 + 14 * ts;
  drawTextC('TAMANHO ' + pad4(player.mass), W / 2, y, PAL.MID, 1); y += 10;
  drawTextC('MELHOR  ' + pad4(best), W / 2, y, PAL.MID, 1); y += 10;
  drawTextC('RIVAIS  ' + alive.length, W / 2, y, PAL.MID, 1); y += 12;

  if((tclock % 1) < 0.62) drawTextC('JOGAR DE NOVO', W / 2, py + ph - 11, PAL.DARK, 1);
}

function render(){
  drawArena();
  drawFood();

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(!s.dead && !s.isPlayer) drawSnake(s);
  }
  if(player && !player.dead) drawSnake(player);
  drawParticles();

  if(mode === 'play') drawHUD();
  if(mode === 'menu') drawMenu();
  if(mode === 'dead'){ drawHUD(); drawDead(); }

  if(flash > 0){
    ctx.fillStyle = 'rgba(223,240,160,' + Math.max(0, Math.min(0.85, flash * 2.4)) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
resize();
resetWorld(false);
cam.x = 0; cam.y = 0;
requestAnimationFrame(loop);

})();
</script>
